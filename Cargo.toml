[package]
name = "rusky"
version = "0.1.0"
edition = "2024"
description = "Popups pour apprendre le russe : vocabulaire, grammaire, alphabet, expressions"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
notify-rust = "4.18.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
