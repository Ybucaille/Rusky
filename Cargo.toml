[package]
name = "rusky"
version = "0.2.0"
edition = "2024"
description = "Popups pour apprendre le russe : vocabulaire, grammaire, alphabet, expressions"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
