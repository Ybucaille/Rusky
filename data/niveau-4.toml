[[card]]
id = "t4-gra-001"
kind = "grammar"
front = "Я чита́л. / Я прочита́л."
question = "Laquelle veut dire « J'ai fini de lire » ?"
back = "Я прочита́л."
wrong = ["Я чита́л.", "Les deux veulent dire la même chose."]
note = "Au passé, le verbe « terminé » (avec про-, с-, на-…) dit qu'on est allé au bout ; l'autre raconte l'action en cours ou habituelle."
level = 1

[[card]]
id = "t4-gra-002"
kind = "grammar"
front = "Он был до́ма."
question = "Que veut dire cette phrase ?"
back = "Il était à la maison."
wrong = ["Il est à la maison.", "Il sera à la maison."]
note = "Le verbe « être » réapparaît au passé : был (il), была́ (elle), бы́ло (neutre), бы́ли (ils)."
level = 2

[[card]]
id = "t4-gra-003"
kind = "grammar"
front = "Я бу́ду рабо́тать."
question = "Que veut dire cette phrase ?"
back = "Je travaillerai."
wrong = ["Je travaillais.", "Je travaille."]
note = "Futur simple : бу́ду + verbe. я бу́ду, ты бу́дешь, он бу́дет…"
level = 3

[[card]]
id = "t4-gra-004"
kind = "grammar"
front = "Я прочита́ю кни́гу."
question = "Que veut dire cette phrase ?"
back = "Je lirai le livre (jusqu'au bout)."
wrong = ["Je lis le livre.", "J'ai lu le livre."]
note = "Un verbe « terminé » conjugué comme au présent donne un futur : прочита́ю = je lirai entièrement."
level = 4

[[card]]
id = "t4-gra-005"
kind = "grammar"
front = "У меня́ боли́т голова́."
question = "Que veut dire cette phrase ?"
back = "J'ai mal à la tête."
wrong = ["J'ai une grosse tête.", "Ma tête va bien."]
note = "У меня́ боли́т + partie du corps = j'ai mal à… Au pluriel : боля́т (ba-LIAT)."
level = 5

[[card]]
id = "t4-gra-006"
kind = "grammar"
front = "Мне хо́лодно."
question = "Que veut dire cette phrase ?"
back = "J'ai froid."
wrong = ["Il est froid.", "Je suis froid."]
note = "Pour les sensations, le russe dit « à moi froid » : мне (à moi) + mot en -о. Ему́ жа́рко = Il a chaud."
level = 6

[[card]]
id = "t4-gra-007"
kind = "grammar"
front = "зимо́й"
question = "Que veut dire зимо́й ?"
back = "en hiver"
wrong = ["l'hiver dernier", "vers l'hiver"]
note = "Les saisons en -ой / -ом veulent dire « en … » : зимо́й, весно́й, ле́том, о́сенью."
level = 7

[[card]]
id = "t4-gra-008"
kind = "grammar"
front = "Он роди́лся в 1990 году́."
question = "Que veut dire cette phrase ?"
back = "Il est né en 1990."
wrong = ["Il a 1990 ans.", "Il vit depuis 1990."]
note = "в + année + году́ (ga-DOU) : в 2020 году́ = en 2020."
level = 8

[[card]]
id = "t4-gra-009"
kind = "grammar"
front = "Я никогда́ не был там."
question = "Pourquoi y a-t-il à la fois никогда́ et не ?"
back = "En russe, « jamais » s'emploie avec не"
wrong = ["C'est une faute", "Pour dire « toujours »"]
note = "Double négation obligatoire : никто́ не (personne ne), ничего́ не (rien ne), никогда́ не (jamais)."
level = 9

[[card]]
id = "t4-gra-010"
kind = "grammar"
front = "Я ду́маю о тебе́."
question = "Que veut dire cette phrase ?"
back = "Je pense à toi."
wrong = ["Je pense comme toi.", "Je pense sans toi."]
note = "ду́мать о + personne = penser à. о ма́ме = à maman, обо мне́ = à moi."
level = 10

[[card]]
id = "t4-gra-011"
kind = "grammar"
front = "Пойдём в кино́!"
question = "Que veut dire cette phrase ?"
back = "Allons au cinéma !"
wrong = ["Je suis allé au cinéma.", "Le cinéma est fermé."]
note = "Пойдём / пое́дем = allons-y (à pied / en véhicule)."
level = 11

[[card]]
id = "t4-gra-012"
kind = "grammar"
front = "Е́сли бу́дет дождь, я оста́нусь до́ма."
question = "Que veut dire е́сли ?"
back = "si"
wrong = ["quand", "parce que"]
note = "е́сли (YÉ-sli) = si. Après е́сли, on met le futur : е́сли бу́дет = s'il y a."
level = 12
