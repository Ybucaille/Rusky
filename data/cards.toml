level = 6

[[card]]
id = "gram-004"
kind = "grammar"
front = "Le pluriel"
back = "-ы après une consonne dure : стол → столы́. -и après к, г, х, ж, ш, ч, щ ou -ь/-й/-я : кни́га → кни́ги. Neutre : -о → -а : окно́ → о́кна."
level = 8

[[card]]
id = "gram-005"
kind = "grammar"
front = "La règle des 7 lettres"
back = "Après г, к, х, ж, ш, ч, щ on n'écrit jamais ы, toujours и."
note = "кни́ги, ма́льчики, ножи́"
