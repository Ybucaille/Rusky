[[card]]
id = "gram-001"
kind = "grammar"
front = "Le genre des noms"
back = "Masculin : consonne ou -й (стол, чай). Féminin : -а/-я (ма́ма, неде́ля). Neutre : -о/-е (окно́, мо́ре). En -ь : les deux (день m., ночь f.)."
level = 2

[[card]]
