[[card]]
id = "gram-001"
kind = "grammar"
front = "кни́га"
pron = "KNI-ga"
question = "кни́га (livre) se termine par -а. Ce mot est donc…"
back = "féminin"
wrong = ["masculin", "neutre"]
note = "En russe, chaque nom est masculin, féminin ou neutre, et sa fin l'indique : consonne → masculin (стол, stol, table) ; -а ou -я → féminin (ма́ма) ; -о ou -е → neutre (окно́, ak-NO, fenêtre)."
level = 2

[[card]]
id = "gram-002"
kind = "grammar"
front = "Я студе́нт."
pron = "ya stou-DIENT"
question = "Que veut dire cette phrase ?"
back = "Je suis étudiant."
wrong = ["J'ai un étudiant.", "J'étais étudiant."]
note = "Au présent, le russe n'utilise pas le verbe « être » : on dit juste « moi étudiant ». Э́то мой дом (È-ta moï dom) = C'est ma maison."
level = 4

[[card]]
id = "gram-003"
kind = "grammar"
front = "У меня́ есть кот."
pron = "ou mi-NIA yest kot"
question = "Que veut dire cette phrase ?"
back = "J'ai un chat."
wrong = ["Je suis un chat.", "Je veux un chat."]
note = "Pour dire « j'ai », le russe dit « chez moi il y a » : у меня́ есть… У тебя́ есть брат? (ou ti-BIA yest brat ?) = Tu as un frère ?"
level = 6

[[card]]
id = "gram-004"
kind = "grammar"
front = "стол → столы́"
pron = "stol → sta-LY"
question = "Que veut dire столы́ ?"
back = "des tables"
wrong = ["une table", "sur la table"]
note = "Au pluriel, la plupart des mots masculins prennent -ы (« y ») : стол → столы́. Les mots en -а aussi : ма́ма → ма́мы (MA-my)."
level = 8

[[card]]
id = "gram-005"
kind = "grammar"
front = "кни́га → кни́ги"
pron = "KNI-ga → KNI-gui"
question = "Pourquoi « des livres » s'écrit кни́ги, avec и, et pas avec ы ?"
back = "Après г, к, х, ж, ш, ч, щ, on n'écrit jamais ы : on met и"
wrong = ["Parce que кни́га est neutre", "Parce que le mot est accentué au début"]
note = "C'est une règle d'orthographe à apprendre telle quelle. Autres exemples : ма́льчики (MAL-tchi-ki) = des garçons, ножи́ (na-JI) = des couteaux."
level = 10

