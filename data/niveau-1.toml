# Cartes de départ de rusky.
#
# Champs :
#   id       unique, garde ta progression quand le texte change
#   kind     alphabet | vocab | grammar | phrase
#   front    ce qu'on montre (en russe le plus souvent)
#   pron     prononciation de front, à la française ; la syllabe accentuée
#            est en MAJUSCULES (ma-la-KO). À omettre si c'est la réponse.
#   back     la bonne réponse
#   question la consigne (sinon une consigne par défaut selon le type)
#   wrong    mauvaises réponses proposées (sinon tirées des autres cartes du même type)
#   note     explication montrée après la réponse
#   level    ordre d'apparition des nouvelles cartes (plus petit = plus tôt)

[[card]]
id = "abc-001"
kind = "alphabet"
front = "Ы ы"
back = "« y » : un « i » dit avec la langue reculée"
note = "Dis « i » avec les lèvres écartées, puis recule la langue vers le fond de la bouche, comme pour « ou », sans arrondir les lèvres : le son est entre « i » et « ou ». On l'écrit « y » dans la prononciation. мы (my) = nous, ты (ty) = tu, сын (syn) = fils."
level = 1

[[card]]
id = "abc-002"
kind = "alphabet"
front = "Щ щ"
back = "« chtch », un « ch » long et doux"
note = "Aujourd'hui on le dit surtout comme un « ch » long et doux, lèvres souriantes, langue contre le palais ; « chtch » est une façon simple de le noter. борщ (borchtch) = bortsch, ещё (yi-CHTCHO) = encore."
level = 2

[[card]]
id = "abc-003"
kind = "alphabet"
front = "Ж ж"
back = "« j » comme dans « jour »"
note = "жена́ (ji-NA) = épouse, жить (jit) = vivre."
level = 3

[[card]]
id = "abc-004"
kind = "alphabet"
front = "Ц ц"
back = "« ts » comme dans « tsar »"
note = "цирк (tsirk) = cirque, у́лица (OU-li-tsa) = rue."
level = 4

[[card]]
id = "abc-005"
kind = "alphabet"
front = "Х х"
back = "« kh », un « h » raclé dans la gorge"
note = "Comme la jota espagnole ou le « ch » allemand de « Bach ». хлеб (khliep) = pain, хорошо́ (kha-ra-CHO) = bien."
level = 5

[[card]]
id = "abc-006"
kind = "alphabet"
front = "Ч ч"
back = "« tch » comme dans « tchèque »"
note = "чай (tchaï) = thé. Exception : что (quoi) se dit « chto »."
level = 6

[[card]]
id = "abc-007"
kind = "alphabet"
front = "Ш ш"
back = "« ch » comme dans « chat »"
note = "шко́ла (CHKO-la) = école, ша́пка (CHAP-ka) = bonnet."
level = 7

[[card]]
id = "abc-008"
kind = "alphabet"
front = "Й й"
back = "« ï » bref, comme la fin de « paille »"
note = "мой (moï) = mon, чай (tchaï) = thé."
level = 8

[[card]]
id = "abc-009"
kind = "alphabet"
front = "Ё ё"
back = "« yo » comme dans « yoga »"
note = "Cette syllabe est toujours celle qu'on appuie. ёлка (YOL-ka) = sapin, ещё (yi-CHTCHO) = encore."
level = 9

[[card]]
id = "abc-010"
kind = "alphabet"
front = "Э э"
back = "« è » comme dans « fête »"
note = "э́то (È-ta) = c'est, эта́ж (è-TACH) = étage."
level = 10

[[card]]
id = "abc-011"
kind = "alphabet"
front = "Ю ю"
back = "« you » comme dans « youpi »"
note = "юг (youk) = sud, люблю́ (liou-BLIOU) = j'aime."
level = 11

[[card]]
id = "abc-012"
kind = "alphabet"
front = "Я я"
back = "« ya » comme dans « yaourt »"
note = "я (ya) = je, моя́ (ma-YA) = ma."
level = 12

[[card]]
id = "abc-013"
kind = "alphabet"
front = "Ь ь"
back = "aucun son : il adoucit la lettre d'avant"
note = "Il rend la consonne précédente plus « mouillée », un peu comme « gn » dans « agneau » pour le н. мать (mat') = mère, день (dien') = jour."
level = 13

[[card]]
id = "abc-014"
kind = "alphabet"
front = "Ъ ъ"
back = "aucun son : il sépare la consonne de la voyelle"
note = "Très rare. Il garde la consonne d'avant « dure » et fait entendre un « y » devant la voyelle suivante : подъе́зд (pad-YEST) = entrée d'immeuble."
level = 14

[[card]]
id = "abc-015"
kind = "alphabet"
front = "Р р"
back = "« r » roulé, comme en espagnol"
note = "Piège : il ressemble à notre P mais se lit « r ». ры́ба (RY-ba) = poisson, рука́ (rou-KA) = main."
level = 15

[[card]]
id = "abc-016"
kind = "alphabet"
front = "В в"
back = "« v » comme dans « vin »"
note = "Piège : il ressemble à notre B mais se lit « v ». вода́ (va-DA) = eau, ваш (vach) = votre."
level = 16

[[card]]
id = "abc-017"
kind = "alphabet"
front = "Н н"
back = "« n » comme dans « nez »"
note = "Piège : il ressemble à notre H mais se lit « n ». нос (nos) = nez, нет (niet) = non."
level = 17

[[card]]
id = "abc-018"
kind = "alphabet"
front = "С с"
back = "« s » comme dans « sel »"
note = "Piège : il ressemble à notre C mais se lit toujours « s ». сок (sok) = jus, сын (syn) = fils."
level = 18

[[card]]
id = "abc-019"
kind = "alphabet"
front = "У у"
back = "« ou » comme dans « loup »"
note = "Piège : il ressemble à notre Y mais se lit « ou ». у́тро (OU-tra) = matin, суп (soup) = soupe."
level = 19

[[card]]
id = "abc-020"
kind = "alphabet"
front = "Б б"
back = "« b » comme dans « bébé »"
note = "Ne pas confondre avec В, qui se lit « v ». банк (bank) = banque, брат (brat) = frère."
level = 20

[[card]]
id = "abc-021"
kind = "alphabet"
front = "Г г"
back = "« g » comme dans « gare »"
note = "Presque toujours « g » dur, jamais « j ». Exception : dans les fins -ого / -его, il se dit « v » (сего́дня, ничего́). год (got) = année, го́род (GO-rat) = ville."
level = 21

[[card]]
