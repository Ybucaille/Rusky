question = "Que veut dire cette phrase ?"
back = "Je suis au parc."
wrong = ["Je vais au parc.", "J'aime le parc."]
note = "Pour dire où l'on est : в + mot en -е. Comparer : в парк (on y va), в па́рке (on y est)."
