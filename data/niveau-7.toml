[[card]]
id = "t7-gra-001"
kind = "grammar"
front = "идти́ / ходи́ть"
question = "Ка́ждый день я хожу́ на рабо́ту. Pourquoi ходи́ть ?"
back = "C'est une habitude, un trajet répété"
wrong = ["C'est un trajet en cours", "C'est au futur"]
note = "Les verbes de mouvement vont par paires : un pour « en ce moment, dans une direction » (идти́, е́хать, лете́ть…), un pour « souvent, aller-retour » (ходи́ть, е́здить, лета́ть…)."
level = 1

[[card]]
id = "t7-gra-002"
kind = "grammar"
front = "Я написа́л письмо́."
question = "Que veut dire cette phrase ?"
back = "J'ai écrit la lettre (elle est finie)."
wrong = ["J'écrivais une lettre.", "J'écrirai une lettre."]
note = "написа́ть est la forme « terminée » de писа́ть : l'action est allée au bout."
level = 2

[[card]]
id = "t7-gra-003"
kind = "grammar"
front = "Я писа́л письмо́ два часа́."
question = "Pourquoi писа́л et pas написа́л ?"
back = "On insiste sur la durée, pas sur le résultat"
wrong = ["Parce que la lettre est finie", "Parce que c'est poli"]
note = "Avec une durée (два часа́, весь день), on prend la forme « en cours »."
level = 3

[[card]]
id = "t7-gra-004"
kind = "grammar"
front = "мно́го книг"
question = "Pourquoi книг et pas кни́ги ?"
back = "Après мно́го, le mot prend la forme « de » au pluriel"
wrong = ["C'est une faute", "C'est au singulier"]
note = "Après мно́го (beaucoup), ма́ло (peu), ско́лько (combien), le nom se met au génitif pluriel : книг, домо́в, люде́й."
level = 4

[[card]]
