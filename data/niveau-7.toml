question = "Que veut dire cette phrase ?"
back = "Je dois travailler."
wrong = ["Je veux travailler.", "Je peux travailler."]
note = "до́лжен (homme), должна́ (femme), должны́ (pluriel) + infinitif = devoir."
level = 5

[[card]]
