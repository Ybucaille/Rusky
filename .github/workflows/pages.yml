name: Site

on:
  push:
    branches: [main]
    paths: [site/**, docs/**, packaging/rusky.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assembler le site (page, vidéo, captures)
        run: |
          mkdir -p _site/assets
          cp site/index.html _site/
          cp docs/demo.mp4 docs/tableau-de-bord.png docs/popup.png _site/assets/
          cp packaging/rusky.svg _site/assets/logo.svg
          # Chaque déploiement pointe vers ses propres fichiers : pas de vieille vidéo en cache.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
